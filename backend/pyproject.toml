[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntitude-backend"
version = "0.0.1"
description = "The Syntitude pangenome browser API — Postgres, Flask, SQLAlchemy"
requires-python = ">=3.11"

# ⛔ Serving deps ONLY. The med school server runs the API and must not need `nuna`,
# which is a private repo. Everything that reads a cluster artifact lives behind the
# `ingest` extra below and runs on a machine that already has the science package.
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# The ingest side. `nuna` is NOT declared here as a resolvable requirement because it is a
# private repo with no index presence — it is supplied by PYTHONPATH or an editable install
# from ~/developer/nuna. Declaring it would make `pip install .[ingest]` fail for everyone.
ingest = ["pandas>=2.0", "pyarrow>=15", "numpy>=1.26"]
# ⚠ The nuna cross-check (tests/test_gff_reader_against_nuna.py) is NOT run from this venv.
# `nuna/__init__.py` pulls anndata, which pulls sklearn, and mirroring that chain here would put
# the whole science stack in a serving package's test extra to prove one 20-line function still
# matches. It is run from nuna's own venv instead -- see backend/README.md -- which has the chain
# already and is where the thing being matched actually lives.
test = ["pytest>=8", "pytest-postgresql>=6"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
