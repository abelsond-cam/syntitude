[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syntitude-backend"
version = "0.0.1"
description = "The Syntitude pangenome browser API — Postgres, Flask, SQLAlchemy"
requires-python = ">=3.11"

# ⛔ Serving deps ONLY. The med school server runs the API and must not need `nuna`,
# which is a private repo. Everything that reads a cluster artifact lives behind the
# `ingest` extra below and runs on a machine that already has the science package.
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# The ingest side. `nuna` is NOT declared here as a resolvable requirement because it is a
# private repo with no index presence — it is supplied by PYTHONPATH or an editable install
# from ~/developer/nuna. Declaring it would make `pip install .[ingest]` fail for everyone.
ingest = ["pandas>=2.0", "pyarrow>=15", "numpy>=1.26", "scikit-learn>=1.4"]
# ⭐ scikit-learn is here for `nuna`, not for us. The PANGENOME layer cannot avoid importing nuna:
# `node_order`, `oriented_windows`, `arrangements`, `neighbour_counts`, `gap_table` and the vendored
# Pfam/GO/COG tables are the science, and a second implementation of any of them is the thing this
# whole design exists to avoid. Importing `nuna.tl.locus_browser.export_payload` transitively
# imports `nuna.eval.metrics`, which imports sklearn at module scope -- so it is a dependency of
# ingest whether or not ingest ever calls it.
#
# ⚠ `nuna` itself is still NOT declared: it is a private repo with no index presence, supplied by
# an editable install (`uv pip install -e ~/developer/nuna`) or PYTHONPATH. Declaring it would make
# `pip install .[ingest]` fail for everyone. The genome layer deliberately vendors its GFF reader
# instead, so THAT half needs none of this -- see `gff/gff_text_reader.py`.
#
# ⭐ With nuna installed here, the cross-check (tests/test_gff_reader_against_nuna.py) stops being
# skipped: its 11 tests now run in this venv rather than only in nuna's own.
test = ["pytest>=8", "pytest-postgresql>=6"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213: the two docstring-blank-line rules that contradict the two we do follow.
# D105: `__repr__` docstrings are noise — the method's name is the whole contract.
# D401: this codebase's docstring voice is deliberately descriptive ("The joint view — whole ±5
#   vectors"), because the first line is read as a definition of the thing, not as an instruction
#   to the reader. Forcing the imperative would make every model docstring worse.
# D400: it cannot see through the house docstring voice. "**Per step, never per model.**" and
#   "**Exactly one row per gene.**" both END with a period — inside the markdown emphasis — and
#   ruff reads the trailing `**` as the last character. Three of the four hits were that; the
#   fourth ended in an ellipsis, which is also terminal punctuation.
ignore = ["D203", "D213", "D105", "D400", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# ⚠ Alembic writes these; they are a RECORD of a schema change, not source we maintain. Reformatting
# one after the fact makes the migration that ran and the migration in the tree different files.
# ⛔ ALL rules, not just formatting ones: `--fix` reordered this file's imports once, and a
#   migration whose bytes differ from the one that actually ran is a migration nobody can diff
#   against the database it produced.
"syntitude_backend/migrations/versions/*" = ["ALL"]
"syntitude_backend/migrations/env.py" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
