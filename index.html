<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<!-- The root goes straight to the default catalogue (David, 2026-08-20). GitHub Pages serves static files
     only, so there is no server-side redirect available: this is the substitute, and it costs one round trip
     before the page itself starts loading. `location.replace` rather than `location.href` so the back button
     leaves the site instead of bouncing off this file forever; the meta refresh is the fallback when script
     is off; the link is the fallback when both are.

     Kept as a redirect rather than a copy of kp.html because a copy would be a second 11.8 MB blob rewritten
     in git on every deploy, and rather than renaming kp.html to index.html because the species picker links
     to a named page and that name should not depend on which species happens to be the default. -->
<meta http-equiv="refresh" content="0; url=kp.html" />
<link rel="canonical" href="kp.html" />
<title>Syntitude.org — pangenome navigator</title>
<script>location.replace("kp.html");</script>
</head>
<body style="font:15px ui-monospace,Menlo,monospace;padding:2rem">
<a href="kp.html">Continue to the Klebsiella pneumoniae pangenome navigator &rarr;</a>
</body>
</html>
